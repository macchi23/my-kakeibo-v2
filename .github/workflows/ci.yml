name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# NOTE: AWS の認証は使わない（cdk synth は環境非依存のスタックなので認証なしで通る）。デプロイはここに置かない
jobs:
  check:
    runs-on: ubuntu-latest
    # Go の契約テスト（backend/internal/store）が使う DynamoDB Local。タグは固定する（latest は使わない）
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks で全履歴を見るため

      - uses: actions/setup-go@v6
        if: hashFiles('backend/go.mod') != ''
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install infra dependencies
        if: hashFiles('infra/package-lock.json') != ''
        working-directory: infra
        run: npm ci

      - name: Install web dependencies
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # DynamoDB Local 用のダミーの値は Go のステップにだけ渡す（他のステップは AWS の認証を使わない）
      - name: Check (go)
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
        run: scripts/check.sh go

      # go 以外は scripts/check.sh all と同じ対象を個別に実行する（go の二重実行を避けるため）
      - name: Check (others)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          for target in infra web shell hooks secrets; do
            scripts/check.sh "$target" || rc=1
          done
          exit $rc
